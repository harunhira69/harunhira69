<svg xmlns="http://www.w3.org/2000/svg" width="216" height="58" viewBox="0 0 216 58" role="img" aria-labelledby="title desc">
  <title id="title">EMAIL — CONTACT</title>
  <desc id="desc">Animated premium profile call-to-action button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="216" y2="58">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="cta" x1="132" y1="0" x2="216" y2="58">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="216" y2="58">
      <stop stop-color="#1d4ed8"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="70" y2="0">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="214" height="56" rx="14"/></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pulse { animation:pulse 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .arrow { animation:arrow 1.8s ease-in-out infinite; }
      .sweep { animation:sweep 3.8s ease-in-out infinite; }
      .edge { animation:edge 4.2s linear infinite; }
      svg:hover .ctaBox { filter:url(#glow); }
      svg:hover .arrow { animation-duration:.85s; }
      @keyframes pulse { 0%,100% { opacity:.75; } 50% { opacity:1; } }
      @keyframes arrow { 0%,100% { transform:translateX(0); } 50% { transform:translateX(3px); } }
      @keyframes sweep { 0%,15% { transform:translateX(-85px); opacity:0; } 30%,60% { opacity:1; } 80%,100% { transform:translateX(235px); opacity:0; } }
      @keyframes edge { to { stroke-dashoffset:-80; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse,.arrow,.sweep,.edge { animation:none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="214" height="56" rx="14" fill="url(#bg)" stroke="#0f2742"/>
  <rect x="1.5" y="1.5" width="213" height="55" rx="13.5" fill="none" stroke="url(#border)" stroke-width="1.3" stroke-dasharray="12 8" class="edge" opacity=".7"/>
  <rect x="134" y="7" width="75" height="44" rx="11" fill="url(#cta)" class="ctaBox pulse"/>
  <rect x="134" y="7" width="75" height="44" rx="11" fill="none" stroke="#dbeafe" stroke-opacity=".18"/>

  <g transform="translate(18 17)" fill="none" stroke="#7dd3fc" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="30" height="22" rx="4"/>
      <path d="m3 4 12 9 12-9"/>
    </g>
  <line x1="57" y1="14" x2="57" y2="44" stroke="#334155"/>
  <text x="68" y="34" class="sans" font-size="12.5" font-weight="800" fill="#e5eefc" letter-spacing=".55">EMAIL</text>
  <text x="146" y="34" class="sans" font-size="12.5" font-weight="900" fill="#fff" letter-spacing=".5">CONTACT</text>
  <text x="191" y="34" class="sans arrow" font-size="15" font-weight="800" fill="#fff">↗</text>

  <g clip-path="url(#clip)" class="sweep">
    <rect x="-78" y="4" width="62" height="50" transform="skewX(-18)" fill="url(#shine)"/>
  </g>

  <circle cx="202" cy="10" r="2" fill="#67e8f9" class="pulse"/>
</svg>
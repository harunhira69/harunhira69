<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="18" viewBox="0 0 1200 18" role="img" aria-label="Animated section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#0f172a" stop-opacity="0"/>
      <stop offset=".18" stop-color="#2563eb" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".75"/>
      <stop offset=".82" stop-color="#2563eb" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="180" y2="0">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <style>
      .runner { animation:run 4.2s ease-in-out infinite; }
      @keyframes run {
        0%,12% { transform:translateX(-220px); opacity:0; }
        25%,70% { opacity:1; }
        88%,100% { transform:translateX(1240px); opacity:0; }
      }
      @media (prefers-reduced-motion: reduce) { .runner { animation:none; } }
    </style>
  </defs>
  <rect x="80" y="8" width="1040" height="1.5" rx=".75" fill="url(#line)"/>
  <g class="runner">
    <rect x="-180" y="6" width="150" height="5" rx="2.5" fill="url(#sweep)" filter="url(#glow)"/>
    <circle cx="-30" cy="8.5" r="2.5" fill="#67e8f9"/>
  </g>
</svg>
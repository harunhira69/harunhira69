<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Harun — Full Stack Developer</title>
  <desc id="desc">Harun, a full stack developer with a focus on backend engineering. A typographic profile header with a custom geometric H monogram.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="400" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#0B1020"/>
    <rect x="800" width="400" height="400" fill="#10182B"/>
    <path d="M800 0V400" stroke="#25314B"/>

    <!-- The identity stays readable while the supporting page text carries detail. -->
    <rect x="64" y="61" width="44" height="5" rx="2.5" fill="#6384FF"/>
    <text x="59" y="187" class="sans" font-size="112" font-weight="750" letter-spacing="-5" fill="#F7F8FC">HARUN</text>
    <text x="65" y="247" class="sans" font-size="38" font-weight="500" letter-spacing="-.7" fill="#F7F8FC">Full Stack Developer</text>
    <text x="66" y="288" class="sans" font-size="24" letter-spacing=".1" fill="#A9B5CF">Backend engineering</text>
    <path d="M65 326H734" stroke="#29354F"/>
    <text x="66" y="360" class="mono" font-size="15" letter-spacing="2.1" fill="#A9B5CF">HARUNHIRA69</text>

    <!-- A bespoke H: aligned pillars with an offset connecting bar. -->
    <circle cx="1000" cy="200" r="137" fill="none" stroke="#29354F"/>
    <path d="M838 200H862M1138 200H1162M1000 38V62M1000 338V362" stroke="#29354F" stroke-width="1.5"/>
    <path d="M907 116H945V181H1035V94H1073V282H1035V219H945V306H907Z" fill="#6384FF"/>
    <path d="M945 181H1035V219H945Z" fill="#8DA6FF"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="17.5" fill="none" stroke="#25314B"/>
</svg>

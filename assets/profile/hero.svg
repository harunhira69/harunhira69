<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Harun — Backend-Focused Full Stack Developer</title>
  <desc id="desc">A dark engineering-console style banner highlighting TypeScript, Node.js, NestJS, React, Next.js, PostgreSQL and Prisma.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#08101d"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(238 86) rotate(35) scale(420 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1022 260) rotate(-150) scale(360 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="96" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset=".52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".06" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .muted { fill: #94a3b8; }
      .line { stroke: #38bdf8; stroke-opacity: .24; stroke-width: 1.4; }
      .node { fill: #0f1f38; stroke: #38bdf8; stroke-opacity: .48; stroke-width: 1.2; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.1s steps(1,end) infinite; }
      .flow { animation: dash 5s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.62; transform:scale(1); } 50% { opacity:1; transform:scale(1.18); } }
      @keyframes blink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
      @keyframes dash { to { stroke-dashoffset:-54; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .blink, .flow { animation:none; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glowB)"/>

  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#3b82f6" stroke-opacity=".24"/>

  <!-- top console bar -->
  <g transform="translate(64 42)">
    <circle cx="0" cy="0" r="5" fill="#334155"/>
    <circle cx="20" cy="0" r="5" fill="#334155"/>
    <circle cx="40" cy="0" r="5" fill="#334155"/>
    <text x="68" y="5" class="mono" font-size="13" fill="#64748b">harun.dev / profile</text>
  </g>

  <!-- availability -->
  <g transform="translate(963 39)">
    <rect width="173" height="34" rx="17" fill="#0d1b2f" stroke="#22c55e" stroke-opacity=".24"/>
    <circle cx="19" cy="17" r="5" fill="#22c55e" class="pulse"/>
    <text x="34" y="22" class="mono" font-size="12" fill="#bbf7d0" letter-spacing=".9">OPEN TO WORK</text>
  </g>

  <!-- main identity -->
  <text x="74" y="122" class="sans" font-size="18" font-weight="700" letter-spacing="4.8" fill="#7dd3fc">HARUN</text>

  <text x="72" y="171" class="sans" font-size="42" font-weight="800" fill="#f8fafc">Backend-Focused</text>
  <text x="72" y="215" class="sans" font-size="42" font-weight="800" fill="url(#accent)">Full Stack Developer</text>

  <text x="74" y="252" class="mono muted" font-size="16">TypeScript  /  Node.js  /  NestJS  /  React  /  Next.js  /  PostgreSQL  /  Prisma</text>

  <!-- command line -->
  <g transform="translate(74 282)">
    <rect width="568" height="34" rx="9" fill="#07101c" stroke="#1d4ed8" stroke-opacity=".22"/>
    <text x="15" y="22" class="mono" font-size="13" fill="#64748b">$</text>
    <text x="33" y="22" class="mono" font-size="13" fill="#cbd5e1">build --secure --scalable --maintainable</text>
    <rect x="365" y="10" width="7" height="16" rx="1" fill="#22d3ee" class="blink"/>
  </g>

  <!-- architecture graphic -->
  <g transform="translate(748 102)">
    <path d="M40 58 C95 14, 150 14, 202 58 S310 102, 356 58" fill="none" class="line flow" stroke-dasharray="6 8"/>
    <path d="M40 136 C95 92, 150 92, 202 136 S310 180, 356 136" fill="none" class="line flow" stroke-dasharray="6 8"/>

    <g>
      <rect x="0" y="40" width="98" height="54" rx="13" class="node"/>
      <text x="49" y="64" text-anchor="middle" class="mono" font-size="11" fill="#7dd3fc">CLIENT</text>
      <text x="49" y="80" text-anchor="middle" class="mono" font-size="10" fill="#64748b">React / Next</text>
    </g>

    <g>
      <rect x="154" y="40" width="98" height="54" rx="13" class="node"/>
      <text x="203" y="64" text-anchor="middle" class="mono" font-size="11" fill="#a5f3fc">API</text>
      <text x="203" y="80" text-anchor="middle" class="mono" font-size="10" fill="#64748b">Node / Nest</text>
    </g>

    <g>
      <rect x="308" y="40" width="98" height="54" rx="13" class="node"/>
      <text x="357" y="64" text-anchor="middle" class="mono" font-size="11" fill="#c4b5fd">DATA</text>
      <text x="357" y="80" text-anchor="middle" class="mono" font-size="10" fill="#64748b">Postgres</text>
    </g>

    <g>
      <rect x="77" y="118" width="98" height="54" rx="13" class="node"/>
      <text x="126" y="142" text-anchor="middle" class="mono" font-size="11" fill="#86efac">AUTH</text>
      <text x="126" y="158" text-anchor="middle" class="mono" font-size="10" fill="#64748b">JWT / RBAC</text>
    </g>

    <g>
      <rect x="231" y="118" width="98" height="54" rx="13" class="node"/>
      <text x="280" y="142" text-anchor="middle" class="mono" font-size="11" fill="#fde68a">PAYMENTS</text>
      <text x="280" y="158" text-anchor="middle" class="mono" font-size="10" fill="#64748b">Stripe</text>
    </g>

    <circle cx="202" cy="67" r="14" fill="#0ea5e9" fill-opacity=".12" filter="url(#softGlow)" class="pulse"/>
    <circle cx="202" cy="67" r="3.6" fill="#22d3ee"/>
  </g>

  <text x="1089" y="317" text-anchor="end" class="mono" font-size="10" fill="#475569" letter-spacing="1.2">BUILD / SECURE / SCALE</text>
</svg>